<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SQUADUP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --surface:#1a1a1c; --surface2:#1a1a1c; --line:rgba(255,255,255,0.14); --panel:#1a1a1c;
  --pink:#FF3D8A; --pink-deep:#C2186B; --you:#FFE21F; --assist:#2BB8FF;
  --gk:#FFC21A; --def:#3D8BFF; --mid:#15E07A; --att:#FF5247;
  --blue:#1FB6FF; --green:#1FE060; --red:#FF3B47;
  --text:#FFFFFF; --muted:#FFFFFF; --muted-dim:#9A9AA8;
  --disp:'Barlow Condensed',sans-serif; --body:'Archivo',sans-serif;
}
*{box-sizing:border-box}
html{background:#000}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-weight:700;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.muted{color:var(--muted)!important;font-weight:700;font-size:16px}
button{font-weight:700;touch-action:manipulation}
@media (max-width:768px){ body.lock{overflow:hidden;height:100dvh;position:fixed;width:100%;left:0;top:0}
  .standCols{flex-direction:column!important}
  .standCols>div:first-child{flex:1 1 auto!important;max-height:40vh}
  .standRight{flex:1 1 auto!important}
  .standRight>div{min-height:90px}
}
@media (min-width:769px){ .backbtn{top:40px;left:34px;width:50px;height:50px;font-size:24px} .mdscreen{padding-top:16vh !important} }
.wheelWrap{position:relative;width:min(380px,90vw);aspect-ratio:1;margin:12px auto}
.wheelWrap svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
#wheelRot{width:100%;height:100%;transform:rotate(0deg);transition:transform 3.4s cubic-bezier(.12,.8,.13,1);will-change:transform}
.wheelTxt{paint-order:stroke;stroke:#06060B;stroke-width:.6px}
.wheelPtr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:30px;z-index:2;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7))}
.segLegend{fill:#C9A227}.segWonder{fill:url(#wgrad)}
.segDEF{fill:#16306b}.segMID{fill:#0e4d2a}.segATT{fill:#62211c}.segGK{fill:#5a4710}
th{font-weight:800}
input,td{font-weight:700}
body{max-width:500px;margin:0 auto;padding:16px 16px 40px;min-height:100dvh;font-size:16px;font-weight:700}
.screen{min-height:calc(100dvh - 90px);display:flex;flex-direction:column;justify-content:flex-start;padding-top:max(96px,calc(env(safe-area-inset-top) + 80px))}
@media (min-width:700px){
  body{max-width:600px;font-size:17px}
  h1:not(.logoBounce){font-size:64px!important}
  .codetext{font-size:84px!important}
  .lotRow{gap:28px!important;transform:translateX(-16px)}
  .lotCardWrap{width:230px!important}
  .lotRow .pcard{width:230px!important}
  .lotRow .ringWrap{width:200px!important;height:200px!important}
  #pauseBtn,#speedBtn{width:200px!important}
  .lotRow .ringSec{font-size:60px!important}
  .auctionWrap{padding-top:6vh!important}
  .bidbar{bottom:max(40px,env(safe-area-inset-bottom))!important}
  .bidbar-scroll{max-height:26vh!important}
  .score{font-size:58px}
  .blackbox .bidline{font-size:25px}
}
h1,h2,.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.02em}
h1{font-size:34px;font-weight:800;margin:10px 0 14px;line-height:1.0}
h2{font-size:24px;font-weight:700;margin:16px 0 10px}
.eyebrow{font-family:var(--disp);text-transform:uppercase;font-weight:700;font-size:16px;letter-spacing:.14em;color:var(--pink);margin-bottom:6px}
.muted{font-size:16px}
.flabel{display:block;font-family:var(--disp);text-transform:uppercase;font-weight:800;font-size:15px;letter-spacing:.1em;color:var(--text);margin:16px 0 7px}
.bigbtn{width:100%;font-size:21px;padding:17px}
.homebtn{font-size:19px;padding:18px 16px;width:100%;max-width:480px}
@keyframes logoBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.logoBounce{animation:logoBounce 1.8s ease-in-out infinite;will-change:transform}
.blackbox{background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin:14px 0;text-align:center}
button{font-family:var(--disp);text-transform:uppercase;font-weight:700;letter-spacing:.04em;font-size:19px;
  padding:14px 19px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--text);cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--pink);border-color:var(--pink);color:#fff}
button:disabled{opacity:.35;pointer-events:none}
input{padding:16px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:18px;width:100%;margin:6px 0;font-family:var(--body);font-weight:700;scroll-margin-top:96px;scroll-margin-bottom:96px}
input::placeholder{color:#5A5A63;opacity:1}
input:focus{outline:2px solid var(--pink);border-color:transparent}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.center{text-align:center}
/* ---------- player card ---------- */
.pcard{position:relative;width:176px;aspect-ratio:3/4.3;border-radius:14px;overflow:hidden;margin:0 auto;border:2px solid rgba(255,255,255,.3);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 34px rgba(0,0,0,.55)}
.pcard .bgGrad{position:absolute;inset:0}
.pcard.GK .bgGrad{background:radial-gradient(120% 90% at 50% 18%,#5a4710 0%,#241d08 58%,#101010 100%)}
.pcard.DEF .bgGrad{background:radial-gradient(120% 90% at 50% 18%,#16306b 0%,#0d1a3a 58%,#0e0e14 100%)}
.pcard.MID .bgGrad{background:radial-gradient(120% 90% at 50% 18%,#0e4d2a 0%,#0a2a18 58%,#0e120e 100%)}
.pcard.ATT .bgGrad{background:radial-gradient(120% 90% at 50% 18%,#62211c 0%,#33120f 58%,#15100f 100%)}
.pcard svg.sil{position:absolute;left:50%;top:16%;transform:translateX(-50%);width:64%;opacity:.92}
.pcard .posb{position:absolute;top:8px;left:8px;font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:.1em;
  padding:3px 9px;border-radius:7px;color:#0b0b10;border:1px solid rgba(255,255,255,.35)}
.pcard.GK .posb{background:var(--gk)} .pcard.DEF .posb{background:var(--def);color:#fff}
.pcard.MID .posb{background:var(--mid);color:#06140b} .pcard.ATT .posb{background:var(--att);color:#fff}
.pcard .nm{position:absolute;left:0;right:0;bottom:0;padding:22px 6px 9px;text-align:center;
  font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:clamp(13px,3.6vw,17px);line-height:1.05;word-break:break-word;
  background:linear-gradient(transparent,rgba(0,0,0,.88) 45%)}
.pcard.sm{width:104px}.pcard.sm .nm{font-size:13px;padding-bottom:7px}.pcard.sm .posb{font-size:13px;padding:2px 7px}
/* ---------- start ready ---------- */
.startready{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:800}
.reconnspin{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.18);border-top-color:var(--pink);animation:reconnSpin .8s linear infinite}
@keyframes reconnSpin{to{transform:rotate(360deg)}}
/* ---------- bid flash ---------- */
.bidflash{animation:bidPulse .55s ease}
@keyframes bidPulse{0%{transform:scale(1);color:var(--text)}30%{transform:scale(1.14);color:var(--pink)}100%{transform:scale(1)}}
/* ---------- confetti ---------- */
.cf{position:fixed;top:0;left:0;width:10px;height:14px;z-index:40;pointer-events:none;animation:cfFall linear both;will-change:transform}
@keyframes cfFall{0%{transform:translateY(-12vh) rotate(0deg);opacity:1}100%{transform:translateY(112vh) rotate(720deg);opacity:1}}
/* ---------- my squad mini ---------- */
.minirow{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;justify-content:flex-start;margin-bottom:10px;padding-bottom:2px}
.minirow::-webkit-scrollbar{display:none}
.mini{flex:0 0 auto;white-space:nowrap}
.mini{display:flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--line);
  border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700}
@media (prefers-reduced-motion: reduce){.cf{display:none}.startready{animation:none}.bidflash{animation:none}}
/* ---------- lot row ---------- */
.lotRow{display:flex;align-items:center;justify-content:center;gap:16px}
.ringSec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:800;font-size:clamp(30px,8vw,42px);color:var(--text)}
.giveup{border-color:var(--att);color:var(--att);background:transparent;font-size:16px}
/* ---------- back button ---------- */
.backbtn{position:fixed;top:max(32px,calc(env(safe-area-inset-top) + 12px));left:max(20px,env(safe-area-inset-left));z-index:70;
  width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface2);border:2px solid var(--line);font-size:22px;padding:0;color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.5);
  transition:transform .12s ease,border-color .12s ease;cursor:pointer}
.backbtn:hover{border-color:var(--pink)}
.backbtn:active{transform:scale(.9)}
.topclear{height:max(92px,calc(env(safe-area-inset-top) + 76px))}
/* ---------- lot reveal ---------- */
.revealCard .pcard{animation:cardBob var(--fade,450ms) ease-out both}
@keyframes cardBob{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
.cd{font-family:var(--disp);font-weight:800;font-size:86px;line-height:1;color:var(--pink);animation:cdPop .9s ease forwards}
@keyframes cdPop{0%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
@media (prefers-reduced-motion: reduce){.revealCard .pcard{animation:none;opacity:1;filter:none}.cd{animation:none}}
/* ---------- lobby code ---------- */
.codebox{background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin:12px 0;text-align:center}
.codetext{font-family:var(--disp);font-weight:800;font-size:58px;line-height:1;letter-spacing:.12em;margin:8px 0 12px;color:var(--text)}
.copybtn{background:var(--pink);border-color:var(--pink);color:#fff;width:100%;font-size:16px}
/* ---------- auction ---------- */
.ringWrap{position:relative;width:300px;height:300px;margin:0 auto}
.auctionWrap{display:flex;flex-direction:column;justify-content:flex-start;gap:14px;padding-top:14px}
.screen.center>button,.screen.center>.bigbtn{align-self:center}
.ringWrap svg.ring{position:absolute;inset:0;transform:rotate(-90deg);width:100%;height:100%}
.ringWrap .pcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.bidline{font-family:var(--disp);font-weight:800;font-size:42px;line-height:1;letter-spacing:.01em}
.bidline small{font-size:18px;color:var(--muted);font-weight:700}
.bidder{color:var(--pink);font-weight:700;font-size:16px}
.bidder .youbid{color:var(--you);font-weight:800}
.bidbar #budgets{margin:0 0 6px}.bidbar .bchip{font-size:11px;padding:5px 7px}
.bidbar{position:fixed;left:16px;right:16px;bottom:max(12px,env(safe-area-inset-bottom));
  max-width:468px;margin:0 auto;display:flex;flex-direction:column;max-height:40vh;overflow:hidden;
  background:rgba(15,15,15,.97);border:1px solid var(--line);border-radius:18px;
  padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.bidbar .bidline,.bidbar #bidderEl{flex:0 0 auto}
.bidbar-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:0;max-height:20vh}
.bidbar-scroll::-webkit-scrollbar{display:none}
@media (min-width:700px){.bidbar{max-width:568px}}
input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:6px;background:var(--surface2);outline:none;border:1px solid var(--line);padding:0;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:var(--pink);border:3px solid #fff;cursor:pointer}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--pink);border:3px solid #fff;cursor:pointer}
.budgets{display:flex;gap:5px;overflow-x:auto;padding:3px 6px;margin:4px auto;justify-content:center;max-width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.budgets::-webkit-scrollbar{display:none}
.bchip{flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:12.5px;line-height:1.2;text-align:center;white-space:nowrap;transition:transform .1s ease,border-color .12s ease}
.bchip:active{transform:scale(.94);border-color:var(--pink)}
.bchip b{font-family:var(--disp);font-size:14px}
.bchip.me{border-color:var(--pink)}
.bchip.done{opacity:.45}
/* ---------- reveals ---------- */
.score{font-family:var(--disp);font-weight:800;font-size:46px;line-height:.95;text-transform:uppercase}
.score .gl{color:var(--pink)}
.featuredTag{display:inline-block;background:var(--pink);color:#fff;font-family:var(--disp);font-weight:800;
  font-size:12px;letter-spacing:.16em;padding:3px 10px;border-radius:6px;text-transform:uppercase}
.evt{font-size:16px;padding:9px 2px;line-height:1.45;border-bottom:1px solid var(--line);opacity:0;animation:pop .4s forwards}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
.tick{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
/* ---------- tables / form ---------- */
table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
td,th{padding:9px 3px;border-bottom:1px solid var(--line);text-align:center;font-size:14px;overflow:hidden;text-overflow:ellipsis}
td:nth-child(2),th:nth-child(2){text-align:left;width:auto}
td:first-child,th:first-child{width:22px}
td:not(:nth-child(2)),th:not(:nth-child(2)){width:26px}
th{font-family:var(--disp);text-transform:uppercase;font-size:12px;letter-spacing:.1em;color:var(--text);font-weight:800}
tr.hu td{background:rgba(255,61,138,.06)}
tr.me td{background:rgba(255,61,138,.14)}
.formchip{display:inline-block;min-width:30px;text-align:center;font-family:var(--disp);font-weight:800;border-radius:8px;padding:2px 6px;color:#0b0b10;border:1px solid rgba(255,255,255,.35)}
.f-g{background:#1FE060}.f-y{background:#ffd23d}.f-o{background:#ff9838}.f-r{background:#ff5247;color:#fff}
.pos{display:inline-block;flex-shrink:0;font-family:var(--disp);font-weight:800;font-size:11px;letter-spacing:.08em;padding:2px 6px;border-radius:5px;margin-right:7px;color:#0b0b10;border:1px solid rgba(255,255,255,.35)}
.pos.GK{background:var(--gk)}.pos.DEF{background:var(--def);color:#fff}.pos.MID{background:var(--mid)}.pos.ATT{background:var(--att);color:#fff}
/* ---------- pick ---------- */
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{display:flex;align-items:center;gap:5px;padding:13px 11px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface2);color:var(--text);font-family:var(--body);font-size:15px;font-weight:700;text-transform:none;letter-spacing:0;text-align:left}
.pbtn.sel{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
.pbtn.inj{opacity:.4}
.fbtn{font-size:16px;padding:10px 14px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:11px}
.fbtn.sel{background:var(--pink);border-color:var(--pink);color:#fff}
.slot .plus{font-size:24px;line-height:1;color:var(--muted-dim);margin-bottom:3px}
.autobtn{width:100%;margin-top:10px;border-color:var(--blue);color:var(--blue);background:transparent;font-size:17px}
.stepbtn{font-family:var(--disp);font-weight:800;font-size:20px;min-width:54px;padding:12px 0;background:var(--surface2);border:1px solid var(--line);border-radius:12px;color:#fff}
.stepbtn:active{background:var(--pink);border-color:var(--pink)}
/* ---------- legend card ---------- */
.pcard.legend .bgGrad{background:radial-gradient(120% 90% at 50% 18%,#fffdf4 0%,#f5ecd0 58%,#e8d9a8 100%)}
.pcard.legend{border:2px solid #C9A227}
.pcard.hero .bgGrad{background:linear-gradient(150deg,#ff3d8a 0%,#a14bff 48%,#3aa0ff 100%)}
.pcard.hero{border:2px solid #c98bff}
.pcard.hero .nm,.pcard.hero .posb{color:#fff}
.segHero{fill:url(#hgrad)}
.pcard.legend .nm{color:#5b4708;background:linear-gradient(transparent,rgba(255,250,235,.95) 45%)}
.pcard.legend svg.sil g{fill:#b99c3f}
.pcard.legend .posb{background:#C9A227!important;color:#fff!important}
.hintchip{position:absolute;top:8px;right:8px;font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:.04em;
  background:rgba(0,0,0,.62);border:1px solid var(--line);border-radius:8px;padding:3px 9px;color:#fff}
.pcard.wonder .bgGrad{background:linear-gradient(165deg,#FF3D8A 0%,#FF9F45 22%,#FFE34D 42%,#1FE060 62%,var(--blue) 80%,#9B5CFF 100%)}

.pcard.wonder .hintchip{background:rgba(0,0,0,.78)}}

/* ---------- winter hub ---------- */
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;padding:12px 17px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);
  font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:17px;letter-spacing:.05em;color:var(--muted)}
.tab.sel{border-color:var(--pink);color:var(--text);background:var(--surface)}
.formchip{font-family:var(--disp);font-weight:800;font-size:17px;padding:4px 10px;border-radius:8px;min-width:52px;text-align:center}
.f-g{background:#123d24;color:#4DF08A}.f-y{background:#3d3712;color:#F2D24B}.f-o{background:#3d2712;color:#F0A24B}.f-r{background:#3d1212;color:#F06B6B}.f-n{background:var(--surface2);color:var(--muted)}
.unitbox{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
.unitbox .uv{font-family:var(--disp);font-weight:800;font-size:36px}
.spinbtn{border-color:#C9A227;color:#C9A227;background:transparent;font-size:17px;padding:10px 13px;min-width:50px}
.tierbanner{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:42px;letter-spacing:.04em}
.ceremonyTxt{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:38px;letter-spacing:.03em;opacity:0;animation:cerIn .8s ease forwards}
@keyframes cerIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.podiumRow{display:flex;align-items:baseline;gap:12px;opacity:0;animation:cerIn .7s ease forwards;margin:10px 0}
.podiumPos{font-family:var(--disp);font-weight:800;font-size:30px;color:var(--muted);min-width:52px}
.podiumName{font-family:var(--disp);font-weight:800;font-size:32px}
.champName{font-family:var(--disp);font-weight:800;font-size:52px;line-height:1.05;color:#C9A227;opacity:0;animation:cerIn .9s ease forwards}
.spinPulse{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:30px;color:var(--muted);
  animation:spinPulse 1s ease infinite}
@keyframes spinPulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
.legendGlow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 45% at 50% 52%,rgba(201,162,39,.28),transparent 70%)}
.tabwrap{position:sticky;top:0;z-index:30;background:linear-gradient(#0B0B10 78%,transparent);padding:8px 0 4px;margin:0 -2px}
.tab.sel{border-color:var(--pink);color:#fff;background:var(--pink)}
.t-worse{color:var(--att)}.t-better{color:#4DF08A}.t-great{color:var(--blue)}.t-legend{color:#C9A227}
/* ---------- pitch squad selection ---------- */
.pitch{background:linear-gradient(180deg,#0B2415,#07180D);border:1px solid rgba(46,201,110,.3);
  border-radius:18px;padding:18px 8px;margin:14px 0;position:relative;box-shadow:inset 0 0 50px rgba(0,0,0,.45)}
.pitch:before{content:'';position:absolute;inset:10px;border:1px solid rgba(255,255,255,.07);border-radius:12px;pointer-events:none}
.prow{display:flex;justify-content:center;align-items:flex-start;gap:10px;margin:9px 0}
.pickCard{position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:96px}
.pickCard .pcard.sm{width:96px;margin:0}
.pickStats{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;width:100%}

<body>
<div id="pausebar" class="paused" style="display:none"></div>
<div id="toast"></div>
<button id="sndBtn" onclick="toggleSnd()" style="position:fixed;top:max(32px,calc(env(safe-area-inset-top) + 12px));right:max(20px,env(safe-area-inset-right));width:46px;height:46px;border-radius:50%;font-size:20px;padding:0;z-index:71;background:var(--surface2);border:2px solid var(--line);color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.5)">🔊</button>
<div id="app"></div>
<div id="reconnstate" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <div class="reconnspin"></div>
  <div style="font-family:var(--disp);font-weight:800;letter-spacing:.08em;font-size:15px;color:#fff;text-transform:uppercase">Reconnecting…</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const s = io();
const VERSION = 'v18.9';
const $ = (h) => { if(typeof closeManagerInfo==='function') closeManagerInfo(); if(typeof clearMatchSfx==='function') clearMatchSfx(); if(h.indexOf('mdscreen')===-1){ if(typeof closeStandings==='function') closeStandings(); if(typeof closeTeamModal==='function') closeTeamModal(); } if(h.indexOf('data-lock')>-1) document.body.classList.add('lock'); else document.body.classList.remove('lock'); document.querySelectorAll('.cf').forEach(n=>n.remove()); document.getElementById('app').innerHTML = h; window.scrollTo(0,0); };
const $k = (h) => { if(typeof closeManagerInfo==='function') closeManagerInfo(); const y = window.scrollY; document.getElementById('app').innerHTML = h; window.scrollTo(0, y); };
let ME = { id:null, code:null, name:null, budget:100 };
let A = null, timerInt = null, pickState = null, lastTable = null, AUCTION_WINDOW = 'main';

function backBtn(inGame){
  return `<button class="backbtn" onclick="goBack(${inGame?1:0})">‹</button>`;
}
// back button + the standard top clearance spacer, so no screen forgets it and they all line up.
// pass a custom onclick (e.g. "home()") or leave blank to use the default leave-game behaviour.
function topBar(onclick){
  const btn = onclick ? `<button class="backbtn" onclick="${onclick}">‹</button>` : backBtn(0);
  return `${btn}<div class="topclear"></div>`;
}
function goBack(inGame){
  if(inGame){
    if(ME.isHost){
      if(!confirm('You are the host. Leaving will END the game for everyone. Are you sure?')) return;
      s.emit('endGame',()=>{});
      try{ localStorage.removeItem('squp'); }catch(e){}
      ME.code=null; ME.uid=null; lastLobby=null;
      location.reload();
      return;
    }
    if(!confirm('Leave the game? You can rejoin with the same code and name.')) return;
    // non-host player leaves: drop to home, keep session so they can rejoin, suppress one auto-rejoin
    try{ sessionStorage.setItem('squp_noauto','1'); }catch(e){}
    location.reload();
    return;
  }
  // lobby (not started): leave server-side and forget it
  if(lastLobby && ME.code){ s.emit('leaveLobby',()=>{}); }
  try{ localStorage.removeItem('squp'); }catch(e){}
  ME.code=null; ME.uid=null; lastLobby=null;
  location.reload();
}
const esc = (t) => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (name) => 1 + ([...name].reduce((a,c)=>a+c.charCodeAt(0),0) % 29);
const SIL = `<svg class="sil" viewBox="0 0 100 110"><g fill="#9a9aa6"><circle cx="50" cy="34" r="20"/><path d="M14 110 C14 76 30 62 50 62 C70 62 86 76 86 110 Z"/></g><g fill="rgba(255,255,255,.10)"><circle cx="44" cy="28" r="20"/></g></svg>`;

function cardHTML(p, sm){
  return `<div class="pcard ${p.pos} ${sm?'sm':''} ${p.legend?'legend':''} ${p.wonderkid?'wonder':''} ${p.hero?'hero':''}">
    <div class="bgGrad"></div>${SIL}
    <div class="posb">${p.pos}</div>
    ${p.hint?`<div class="hintchip">${p.hint}</div>`:''}
    <div class="nm">${esc(p.name)}</div>

}

/* ---------------- HOME ---------------- */
function home(){
  if(typeof hideReconn==='function') hideReconn();
  $(`<div class="screen center" id="homeScr" style="position:relative;overflow:hidden;min-height:100dvh;justify-content:flex-start;padding-top:10vh;padding-bottom:6vh">

  <div style="margin:22px 0 28px;font-size:15px;font-weight:700;color:var(--muted)">Outbid your mates. Sign wonderkids & legends.<br>Win the league.</div>
  <button class="bigbtn homebtn" style="background:#fff;border-color:#fff;color:#000;font-weight:800" onclick="showSetup('solo')">🎮 Single player</button>
  <button class="primary bigbtn homebtn" style="margin-top:12px" onclick="showSetup('create')">Create a lobby</button>

  <button class="bigbtn homebtn" style="margin-top:12px;background:var(--you);border-color:var(--you);color:#000;font-weight:800" onclick="renderWhatsNew()">⭐ What's new!</button>
  <div id="rejoinSlot" style="width:100%;max-width:300px;display:flex;flex-direction:column;align-items:center"></div>

  </div>
  </div>`);
  try{
    const sv=JSON.parse(localStorage.getItem('squp')||'null');
    if(sv&&sv.name) s.emit('findMyGames',{name:sv.name},(r)=>{
      const el=document.getElementById('rejoinSlot');
      if(!el||!r||!r.games||!r.games.length) return;
      el.innerHTML = r.games.map(gm=>`<button class="bigbtn homebtn" style="margin-top:12px;border-color:var(--blue);color:var(--blue)"
        onclick="rejoinAs('${gm.code}')">↻ Rejoin game ${gm.code} as ${esc(sv.name)}</button>`).join('');
    });
  }catch(e){}
}
function renderWhatsNew(){
  const li=(t)=>`<div style="font-size:17px;line-height:1.55;padding:6px 0;color:#fff">• ${t}</div>`;
  $(`${topBar("home()")}
  <div class="eyebrow">What's new</div>
  <h1 style="color:var(--you)">⭐ What's changed</h1>
  <div class="panel" style="border-color:#1FE060"><h2 style="margin-top:0;color:#1FE060">NEW</h2>
    ${li(`🎮 <b>SINGLE PLAYER</b> — take on a full field of AI clubs solo, on Easy or Hard`)}
    ${li(`📊 <b>LIVE STANDINGS</b> — open the league table any time, with top scorers &amp; top assists, updating every matchweek`)}

    ${li(`👑 <b>LEGENDS &amp; WONDERKIDS</b> — all-time greats and rainbow-card prospects light up the winter market`)}
  </div>
  <div class="panel" style="border-color:var(--blue)"><h2 style="margin-top:0;color:var(--blue)">IMPROVED &amp; REMOVED</h2>
    ${li(`📈 Squads that grow, fade and surprise you across the year`)}
    ${li(`🟥 Red cards &amp; suspensions — a sent-off player misses the next game and your best sub steps in automatically`)}
    ${li(`🤖 Smarter rivals — the AI clubs will push you all the way`)}
    ${li(`⚡ In solo, give up on a player and the lot settles instantly — no waiting on the bots`)}
    ${li(`🚫 Removed the spin / reroll step — cleaner flow straight into the winter market`)}
    ${li(`🏁 A live animated title race, trophy lift &amp; end-of-season awards`)}
  </div>
  <button class="primary bigbtn" style="margin-top:14px" onclick="home()">‹ Back</button>`);
}
function renderHowTo(){
  $(`${topBar("home()")}
  <div class="eyebrow">How to play</div>
  <h1>SQUADUP in 60 seconds</h1>
  <div class="panel"><h2 style="margin-top:0">1 · The auction</h2>
  <div style="font-size:16px;line-height:1.5">Everyone starts with the same budget. Players come up one at a time and you bid against your rivals — the host runs the room. Snap up stars, sneaky bargains and rainbow-carded <b>wonderkids</b>, and build the deepest squad you can afford. Playing solo? When you give up on a player, the lot settles straight away.</div></div>
  <div class="panel"><h2 style="margin-top:0">2 · Pick your team</h2>
  <div style="font-size:16px;line-height:1.5">Choose your shape — <b style="color:var(--red)">Attacking</b>, <b style="color:var(--green)">Balanced</b> or <b style="color:var(--blue)">Defensive</b> — and it genuinely shapes your matches. Attacking scores more but leaks more, Defensive grinds out clean sheets, Balanced sits between — none is stronger, they just play differently. Your live <b>⚔️ Attack · 🎯 Midfield · 🛡️ Defence</b> ratings move as you pick. Take all the time you want; the game waits for everyone.</div></div>
  <div class="panel"><h2 style="margin-top:0">3 · The season</h2>
  <div style="font-size:16px;line-height:1.5">Battle through the campaign with full match commentary and plenty of drama — in your own matches, <b style="color:var(--you)">your team's moments are highlighted</b> so you can follow your story. A red card means a one-game ban, and your best available sub fills in for that match. Open the <b>📊 standings</b> any time to see the live table and top scorers. Better teams tend to win, but upsets and last-gasp moments are always on the cards.</div></div>
  <div class="panel"><h2 style="margin-top:0">4 · The winter break</h2>
  <div style="font-size:16px;line-height:1.5">At halfway you get a full visual look at your squad — every card shows its <b>updated rating</b> and how it moved, plus the player's <b>season goals, assists and form</b>. Set your lineup, then the winter market opens: a fresh war chest, marquee names and <b>LEGENDS 👑</b> up for grabs. Re-jig your team and chase the second half.</div></div>
  <div class="panel"><h2 style="margin-top:0">5 · Glory</h2>
  <div style="font-size:16px;line-height:1.5">Most points takes the crown. Sit back for the animated title race, the trophy lift and the end-of-season awards — Golden Boot, top playmaker, best bargain and more.</div></div>
  <button class="primary bigbtn" style="margin-top:14px" onclick="home()">‹ Back</button>`);
}
function rejoinAs(code){
  const sv=JSON.parse(localStorage.getItem('squp')||'null'); if(!sv) return;
  s.emit('joinLobby',{code,name:sv.name,club:'',uid:sv.uid},(r)=>{
    if(r.error) return toast(r.error);
    onJoined(r,sv.name);
    if(!r.snapshot) toast('Back in — waiting for the next event');
  });
}
function randName(){
  const names=['Alex','Sam','Jordan','Casey','Morgan','Riley','Jamie','Taylor','Charlie','Robin','Frankie','Dale','Reece','Kai','Marco','Diego','Luca','Theo','Rio','Ash','Nico','Sol','Drew','Max','Joel','Remi','Bo','Cruz','Zane','Ivo'];
  const el=document.getElementById('name'); if(el){ el.value=names[Math.floor(Math.random()*names.length)]; }
}

  const a=['Real','Athletic','Inter','Royal','Dynamo','Sporting','United','City','Atletico','Olympic','Phoenix','Iron','Crimson','Northern','Eastside','Golden','Rapid','Steel','Wild','Apex'];
  const b=['Rovers','United','City','Athletic','Wanderers','Town','FC','Albion','Hotspurs','Galaxy','Rangers','Lions','Wolves','Stars','Sharks','Kings','Dragons','Vipers','Titans','Bears'];
  const el=document.getElementById('club'); if(el){ el.value=a[Math.floor(Math.random()*a.length)]+' '+b[Math.floor(Math.random()*b.length)]; }
}
function showSetup(mode){
  window.__solo = (mode==='solo');
  ME.solo = (mode==='solo');
  if(mode==='solo') mode='create';
  $(`<button class="backbtn" onclick="home()">‹</button>
  <div class="screen">
  <div class="eyebrow">${mode==='create'?'Create a lobby':'Join a lobby'}</div>
  <h1>${mode==='create'?'Your details':'Enter the code'}</h1>
  <div class="panel" style="padding:22px">
    ${mode==='join'?`<label class="flabel">Lobby code</label>
    <input id="code" placeholder="e.g. 42" inputmode="numeric" pattern="[0-9]*" style="font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:.14em;text-align:center" maxlength="2">`:''}
    <label class="flabel">Your name</label>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="name" placeholder="Name" maxlength="14" style="flex:1">
      <button onclick="randName()" aria-label="Random name" style="flex:0 0 auto;width:54px;height:54px;font-size:22px;padding:0;border-radius:12px;background:var(--surface2);border:1px solid var(--line)">🎲</button>
    </div>
    <label class="flabel">Club name <span class="muted">(optional)</span></label>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="club" placeholder="Team Name" maxlength="18" style="flex:1">
      <button onclick="randClub()" aria-label="Random club" style="flex:0 0 auto;width:54px;height:54px;font-size:22px;padding:0;border-radius:12px;background:var(--surface2);border:1px solid var(--line)">🎲</button>
    </div>
    ${mode==='create'?`<label class="flabel" style="margin-top:14px">Rating hints</label>
    <button id="hintsTgl" data-on="1" class="startready" style="width:100%;font-size:16px" onclick="this.dataset.on=this.dataset.on==='1'?'0':'1';this.textContent=this.dataset.on==='1'?'Rating ranges: ON':'Rating ranges: OFF';this.classList.toggle('startready',this.dataset.on==='1')">Rating ranges: ON</button>
    <div style="font-size:14px;margin-top:8px;color:var(--muted);font-weight:700;line-height:1.5">Shows a rough range on every auction card, e.g. 84–91. The exact rating stays secret until he's signed.</div>
    ${!window.__solo?`<label class="flabel" style="margin-top:16px">Live standings</label>
    <button id="standTgl" data-on="1" class="startready" style="width:100%;font-size:16px" onclick="this.dataset.on=this.dataset.on==='1'?'0':'1';this.textContent=this.dataset.on==='1'?'League standings: ON':'League standings: OFF';this.classList.toggle('startready',this.dataset.on==='1')">League standings: ON</button>
    <div style="font-size:14px;margin-top:8px;color:var(--muted);font-weight:700;line-height:1.5">A live league table players can open during matches and the winter break. Turn off to hide it entirely.</div>`:''}`:''}
    <button class="primary bigbtn" style="margin-top:22px" onclick="${mode==='create'?'createL()':'joinL()'}">${mode==='create'?'Create lobby':'Join lobby'}</button>
  </div>

}
function getNC(){
  const name=document.getElementById('name').value.trim();
  const club=document.getElementById('club').value.trim()||((name||'My')+' FC');
  return {name,club};
}
function addBot(){
  // add at whatever the current global difficulty is (read from the toggle, default easy)
  const t=document.getElementById('diffToggle');
  const difficulty=(t && t.textContent.trim()==='HARD')?'hard':'easy';
  s.emit('addBot',{difficulty},(r)=>{ if(r&&r.error) return toast(r.error); if(lastLobby) renderLobby(lastLobby); });
}
function setBotsDiff(diff){
  s.emit('setBotsDiff',{difficulty:diff},(r)=>{ if(r&&r.error) return toast(r.error); if(lastLobby) renderLobby(lastLobby); });
}
function createL(){ const {name,club}=getNC(); if(!name) return toast('Enter a name');
  const tgl=document.getElementById('hintsTgl');
  const stg=document.getElementById('standTgl');
  const standings = window.__solo ? true : (stg ? stg.dataset.on==='1' : true);
  s.emit('createLobby',{name,club,hints:tgl&&tgl.dataset.on==='1',standings},(r)=>{ if(r.error) return toast(r.error); onJoined(r,name); }); }
function joinL(){ const {name,club}=getNC(); const code=document.getElementById('code').value.trim();
  if(!name) return toast('Enter a name'); if(!code) return toast('Enter the lobby code');
  s.emit('joinLobby',{code,name,club},(r)=>{ if(r.error) return toast(r.error); onJoined(r,name); }); }
function onJoined(r,name){ ME.id=r.managerId; ME.code=r.code; ME.name=name; if(r.uid) ME.uid=r.uid;
  try{ localStorage.setItem('squp', JSON.stringify({name, code:r.code, uid:ME.uid})); }catch(e){}
  if(lastLobby && lastLobby.code===ME.code) renderLobby(lastLobby);
  if(r.snapshot) restoreFromSnapshot(r.snapshot); }
let reconnTimer=null, reconnPending=false;
function showReconn(){
  // only block when we're actually in a game/lobby — never on the home screen
  if(!ME.code){ return; }
  const el=document.getElementById('reconnstate'); if(el) el.style.display='flex';
  reconnPending=true;
}
function hideReconn(){
  reconnPending=false;
  clearTimeout(reconnTimer); reconnTimer=null;
  const el=document.getElementById('reconnstate'); if(el) el.style.display='none';
}
// force a fresh, confirmed reconnect. Keeps the overlay up until resyncSession's ack lands.
function ensureLive(){
  if(!ME.code) return; // not in a game — nothing to guard
  showReconn();
  clearTimeout(reconnTimer);
  // After a tab-out the socket may be frozen/stale: it can report connected while its emits go
  // nowhere. Don't trust it — force a clean reconnect cycle and let the fresh 'connect' handler
  // re-join + resume. socket.io fires 'connect' once the new transport is live, and our connect
  // handler calls resyncSession() which hides the overlay on the server's ack.
  try{
    if(s.connected){ s.disconnect(); }
    s.connect();
  }catch(e){}
  // absolute safety: never let the overlay hang forever.
  reconnTimer=setTimeout(()=>{ if(reconnPending){ try{ if(!s.connected) s.connect(); }catch(e){} resyncSession(); } }, 6000);
}
function resyncSessionAck(onAck){ resyncSession(onAck); }
function resyncSession(onAck){
  try{ if(sessionStorage.getItem('squp_noauto')){ sessionStorage.removeItem('squp_noauto'); hideReconn(); return; } }catch(e){}
  let code=ME.code, name=ME.name, uid=ME.uid;
  if(!code || !name){ // after a hard refresh ME is empty — pull the saved session
    try{ const sv=JSON.parse(localStorage.getItem('squp')||'null'); if(sv&&sv.code&&sv.name){ code=sv.code; name=sv.name; uid=sv.uid; } }catch(e){}
  }
  if(!code || !name){ hideReconn(); return; }
  s.emit('joinLobby',{code,name,club:'',uid},(r)=>{
    if(typeof onAck==='function') onAck();
    if(r && r.ok){ ME.id=r.managerId; ME.code=code; ME.name=name; if(r.uid) ME.uid=r.uid;
      try{ localStorage.setItem('squp', JSON.stringify({name:ME.name, code:ME.code, uid:ME.uid})); }catch(e){}
      if(r.snapshot) restoreFromSnapshot(r.snapshot);
      hideReconn(); // confirmed live + re-synced: input is safe again
    } else if(r && r.error && /not found/i.test(r.error)){ ME.code=null; hideReconn(); }
    else { hideReconn(); }
  });
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  if(AC && AC.state==='suspended') AC.resume(); // restore sound after tab-out suspended the audio context
  if(!s){ return; }
  ensureLive(); // tab back: blur+spinner until the socket is confirmed live and re-synced
});
/* ---------------- SOUND ---------------- */
let AC=null, SND=(localStorage.getItem('squp_snd')??'1')==='1';
function sndInit(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
document.addEventListener('pointerdown', sndInit);
function tone(f,dur,type,vol,when,f2){ if(!SND) return; sndInit(); if(!AC) return; const t=AC.currentTime+(when||0);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.linearRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime((vol||0.12)*0.28,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.05); }
function sfx(k){ if(!SND) return; if(!AC){ sndInit(); } if(!AC) return; if(AC.state==='suspended') AC.resume();
  if(k==='bid'){ tone(620,0.07,'square',0.07); tone(880,0.06,'square',0.05,0.05); }
  else if(k==='tick'){ tone(1100,0.05,'square',0.06); }
  else if(k==='sold'){ tone(523,0.12,'triangle',0.12); tone(659,0.12,'triangle',0.12,0.1); tone(784,0.2,'triangle',0.14,0.2); }
  else if(k==='unsold'){ tone(220,0.25,'sawtooth',0.06); }
  else if(k==='goal'){ tone(440,0.08,'square',0.08); tone(660,0.14,'square',0.08,0.07); }
  else if(k==='spin'){ for(let i=0;i<14;i++) tone(900+((i%2)*180),0.035,'square',0.045,i*0.22); }
  else if(k==='prize'){ tone(523,0.1,'triangle',0.12); tone(659,0.1,'triangle',0.12,0.09); tone(784,0.1,'triangle',0.12,0.18); tone(1047,0.3,'triangle',0.15,0.27); }
  else if(k==='pause'){ tone(330,0.1,'sine',0.08); }
  else if(k==='click'){ tone(700,0.035,'square',0.035); }
  else if(k==='cheer'){ [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,0.13,'square',0.1,i*0.09)); tone(1568,0.35,'square',0.12,0.54); } // mario-style run up
  else if(k==='boo'){ tone(330,0.4,'sawtooth',0.09,0,294); tone(294,0.4,'sawtooth',0.09,0.42,262); tone(262,0.9,'sawtooth',0.1,0.84,196); } // waa waa waaaa
  else if(k==='splash'){ tone(392,0.12,'triangle',0.1); tone(523,0.22,'triangle',0.12,0.11); }
  else if(k==='win'){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.16,'triangle',0.14,i*0.15)); }
}

function restoreFromSnapshot(snap){
  if(!snap) return;
  ME.isHost = (snap.hostUid && ME.uid) ? (snap.hostUid===ME.uid) : (snap.hostId===ME.id);
  if(typeof snap.showStandings==='boolean'){ ME.standings=snap.showStandings; STANDINGS_ON=snap.showStandings; }
  if(snap.standings) STANDINGS=snap.standings;
  if(snap.standingsStats) STANDINGS_STATS=snap.standingsStats;
  if(snap.serverV && snap.serverV!==VERSION) toast('⚠️ Server '+snap.serverV+' / client '+VERSION+' — redeploy ALL files');
  // re-apply pause state FIRST so whatever view renders shows the pause bar + Resume button
  isPaused = !!snap.paused;
  hostPausedLocal = !!snap.hostPaused;
  const applyPauseUI = ()=>{
    const b=document.getElementById('pausebar');
    if(b){ if(isPaused){ b.style.display='block'; b.textContent = hostPausedLocal? '⏸ Paused' : '⏸ Paused — disconnected player'; } else b.style.display='none'; }
    syncPauseBtn();
  };
  if(snap.reveal){ renderMatch(snap.reveal, true); setTimeout(applyPauseUI,0); return; }
  if(snap.winter && !snap.auction){ WINTER_IAMREADY=!!snap.winterReadyMine; applyWinter(snap.winter); setTimeout(applyPauseUI,0); return; }
  // rebuild the budget/squad-count strip from the snapshot so it's correct right after a reconnect
  if(Array.isArray(snap.managers)){
    BUDG = snap.managers.map(m=>({ name:m.name, budget:m.budget, squadCount:(m.squad&&typeof m.squad.count==='number')?m.squad.count:(Array.isArray(m.squad)?m.squad.length:0), done:!!m.sacked, signings:m.signings||[] }));
    const me=BUDG.find(r=>r.name===ME.name); if(me) ME.budget=me.budget;
  }
  if(typeof paintBudgets==='function') setTimeout(paintBudgets,0);
  if(snap.awaitingNext){
    const r=snap.awaitingNext.result;
    if(r && r.sold){
      flashResult(`<span style="color:var(--pink)">SOLD</span> £${r.price}m`, `<b>${esc(r.player)}</b> → ${soldToLabel(r.manager,r.managerUid)}`);
    } else if(r){
      flashResult('UNSOLD', esc(r.player));
    } else {
      flashResult('Ready', 'Bring up the next player');
    }
    const el=document.getElementById('nextslot');
    if(el){
      if(isPaused){
        // host tabbed out and the auction is paused — they must Resume before advancing,
        // otherwise "Next player" just errors with "Auction is paused".
        el.innerHTML = ME.isHost
          ? `<button class="primary" style="width:80%" onclick="s.emit('hostResume',(r)=>{if(r&&r.error)toast(r.error);})">▶ Resume auction</button>`
          : `<div class="muted">Paused — waiting for the host to resume…</div>`;
      } else {
        el.innerHTML = ME.isHost
          ? `<button class="primary" style="width:80%" onclick="s.emit('hostNext',(r)=>{if(r&&r.error)toast(r.error)})">Next player ▸</button>`
          : `<div class="muted">Waiting for ${esc(snap.awaitingNext.hostName)} to bring up the next player…</div>`;
      }
    }
    setTimeout(applyPauseUI,0);
    return;
  }
  if(snap.pick){
    if(snap.pick.locked){
      $(`<div class="screen center" style="justify-content:center"><div class="blackbox" style="width:100%"><div class="score">Locked in</div>
      <div class="muted" style="margin-top:8px">Waiting for the other managers…</div></div></div>`);
    } else {
      pickState={half:snap.pick.half, squad:snap.pick.squad, slots:null, prevStarters:snap.pick.prevStarters||[]};
      initSlots(); renderPick();
    }
    return;
  }
  if(snap.phase==='lobby'){
    // tab-out reclaim while still in the lobby: rebuild the lobby view fresh with the new socket id
    lastLobby = { code:snap.code, hostId:snap.hostId, managers:snap.managers.map(m=>({id:m.id,name:m.name,club:m.club,ready:m.ready,connected:m.connected!==false,isBot:!!m.isBot,diff:m.diff||null})) };
    renderLobby(lastLobby);
    return;
  }
  if(snap.phase==='finished' && snap.finalData){
    // game's already over — go straight to the final table/awards, skip the animated race replay
    window.__finalData=snap.finalData;
    MATCHLIVE=false;
    showFinal();
    return;
  }
  if(snap.auction && snap.auction.player){
    AUCTION_WINDOW = snap.auction.window || 'main';
    A={ index:snap.auction.index, total:snap.auction.total, player:snap.auction.player,
        highBid:snap.auction.highBid, highBidder:snap.auction.highBidder, highBidderUid:snap.auction.highBidderUid,
        deadline:snap.auction.deadline, start:16000 };
    if(snap.auction.revealLeft>500){ s_lotReveal({index:A.index,total:A.total,player:A.player,revealMs:snap.auction.revealLeft}); }
    else renderLot();
    setTimeout(applyPauseUI,0);
  } else if(snap.phase!=='lobby'){
    $(`<div class="screen center" style="justify-content:center"><div class="score" style="font-size:30px">You're back in</div>
    <div class="muted" style="margin-top:8px">Hang tight for the next event…</div>
    <button class="bigbtn" style="margin-top:22px;max-width:300px" onclick="location.reload()">‹ Back to home</button></div>`);
  }
}
function copyCode(c){
  const done=()=>toast('Code copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(c).then(done).catch(()=>fallbackCopy(c,done)); }
  else fallbackCopy(c,done);
}
function fallbackCopy(c,done){
  const t=document.createElement('textarea'); t.value=c; document.body.appendChild(t); t.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(t); done();
}

function feasibleForms(avail){

function makeshiftSlots(avail){

  const c={DEF:avail.filter(p=>p.pos==='DEF').length, MID:avail.filter(p=>p.pos==='MID').length, ATT:avail.filter(p=>p.pos==='ATT').length};
  const out=[];
  for(const pos of ['DEF','MID','ATT']) if(c[pos]>0){ out.push(pos); c[pos]--; }
  const order=['DEF','MID','ATT'];
  while(out.length<4){
    const best=order.filter(p=>c[p]>0).sort((a,b)=>c[b]-c[a])[0];
    if(!best) break;
    out.push(best); c[best]--;
  }
  return [].concat(out.filter(p=>p==='ATT'),out.filter(p=>p==='MID'),out.filter(p=>p==='DEF'),['GK'])
    .map(pos=>({pos,player:null,ppos:pos}));

function submitWinterPick(){

  WINTER_IAMREADY=true; try{sessionStorage.removeItem(draftKey());}catch(e){} renderPick();

function autoXI(){
  if(!pickState) return;
  const avail=pickState.squad.filter(p=>!p.injured);
  const byPos=(pos)=>avail.filter(p=>p.pos===pos).sort((a,b)=>(b.rtg||0)-(a.rtg||0));
  const tryFill=(d,m2,a)=>{
    const need={GK:1,DEF:d,MID:m2,ATT:a};
    const chosen=[];
    for(const pos of ['GK','DEF','MID','ATT']){
      const list=byPos(pos);
      if(list.length<need[pos]) return null;
      chosen.push(...list.slice(0,need[pos]));
    }
    return chosen;
  };
  let shape=CURFORM, picks=tryFill(...CURFORM);
  if(!picks){ for(const f of FORMSETS){ picks=tryFill(...f); if(picks){ shape=f; break; } } }
  if(!picks) return toast('Not enough players for any shape');
  CURFORM=shape;
  const slots=slotsFor(...shape);
  for(const p2 of picks){ const sl=slots.find(x=>x.pos===p2.pos&&!x.player); if(sl){ sl.player=p2.name; sl.ppos=p2.pos; } }
  pickState.slots=slots; saveDraft(); renderPick();
}
function pickForm(d,m2,a){
  CURFORM=[d,m2,a];
  pickState.slots=rebuildSlots(pickState.slots, pickState.squad.filter(x=>!x.injured), d,m2,a);
  saveDraft(); renderPick();
}

}

  if(!instant){

    } else if(homeHuman || awayHuman){
      // one human side: cheer if the human won (or drew), boo only if the human lost to the AI

    const evN=(m.events&&m.events.length)||0;
    const shown=Math.min(2,evN);
    const delayMs=(2.1 + shown*0.5 + 0.4)*1000;

  }

  if(w.table) STANDINGS=w.table;
  if(w.stats) STANDINGS_STATS=w.stats;
  STANDINGS_ON = (typeof ME.standings==='boolean') ? ME.standings : (w.showStandings!==false);
  STANDINGS_REVEALED=true;
  clearTimeout(window.__standReveal);
  // The pre-market squad/lineup screen has been removed — the winter market opens straight away,
  // and this squad data is kept only for the post-market lineup pick. Sacked players still see their notice.
  if(ME.sacked){ renderWinterSacked(); return; }
  $(`<div class="screen center" style="justify-content:center"><div class="blackbox" style="width:100%"><div class="score" style="color:var(--you)">❄️ Winter market</div>
    <div class="muted" style="margin-top:8px">Opening the market…</div></div></div>`);
}
s.on('winter',applyWinter);
s.on('winterUpdate',(u)=>{ if(W&&u.review){ W.review=u.review; } });
s.on('winterReady',(d)=>{ WINTER_READY=d; if(pickState && pickState.half==='winter' && !WINTER_IAMREADY) renderPick(); });
let WINTER_READY=null;
let WINTER_IAMREADY=false;
function renderWinterSacked(){
  $(`${topBar('home()')}
  <div class="eyebrow" style="padding-top:4px">Winter break</div>
  <h1 style="margin-bottom:6px">You were sacked</h1>
  <div class="blackbox" style="padding:18px;text-align:center;margin:10px 0"><div class="muted">Your club plays on under AI control. Sit back and watch the run-in.</div></div>
  ${standingsBtnHTML()}
  <div class="center muted" style="padding:14px 0">Waiting for the others…</div>`);
}
function winterNextSolo(){ s.emit('startWinterAuction',(r)=>{ if(r&&r.error) toast(r.error); }); }
// goals/assists/form/rating mini-boxes drawn onto each lineup card
/* stats helpers (kept; used on the winter lineup + nowhere else now) */
function statPanels(st,mineOnly){
  let scorers=(st&&st.topScorers)||[], assists=(st&&st.topAssists)||[];
  if(mineOnly && ME.club){
    scorers=scorers.filter(r=>r.owner===ME.club);
    assists=assists.filter(r=>r.owner===ME.club);
  }
  const row=(r,i,v)=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)">
    <span class="muted" style="min-width:26px;font-size:15px">${i+1}</span>
    <span class="grow" style="font-size:17px;font-weight:700">${esc(r.name)}</span>
    <span class="muted" style="font-size:14px;margin-right:8px">${r.owner?esc(r.owner):'—'}</span>
    <span class="disp" style="font-family:var(--disp);font-weight:800;font-size:20px">${v}</span></div>`;
  return `${scorers.length?`<h2 style="margin-top:18px">👟 Your top scorers</h2><div class="panel">${scorers.map((r,i)=>row(r,i,r.goals)).join('')}</div>`:''}
  ${assists.length?`<h2>🎯 Your top assists</h2><div class="panel">${assists.map((r,i)=>row(r,i,r.assists)).join('')}</div>`:''}`;
}

/* ---------------- FINISH ---------------- */
s.on('finished',(f)=>{ MATCHLIVE=false; runCeremony(f); });
let CTIMERS=[];
function runCeremony(f){
  CTIMERS.forEach(clearTimeout); CTIMERS=[];
  window.__finalData=f;
  if(f.race && f.race.length && f.race[0].pts && f.race[0].pts.length){ return runLeagueRace(f); }
  ceremonyPodium(f);
}
function runLeagueRace(f){
  const teams=f.race.filter(t=>t.pts&&t.pts.length);
  const MD=Math.max(...teams.map(t=>t.pts.length));
  const palette=['#FF2E7E','var(--blue)','#1FE060','#F4FF00','#9B5CFF','#FF8A3D','#FF5470','#56E0C8','#C9A227','#B7B7C4'];
  teams.forEach((t,i)=>t._c=t.human?palette[i%palette.length]:'#555');
  const maxPts=Math.max(1,...teams.map(t=>t.pts[t.pts.length-1]));
  $(`<div class="screen center" style="justify-content:center;min-height:100dvh">
    <div class="eyebrow" style="margin-bottom:10px;font-size:15px">The race for the title</div>
    <div id="raceMd" class="disp" style="font-size:22px;margin-bottom:18px">Matchday 1</div>
    <div id="raceRows" style="width:100%;max-width:460px;display:flex;flex-direction:column;gap:7px"></div>
    <div id="raceNext" style="margin-top:22px;min-height:48px"></div>
  </div>`);
  let md=0;
  const draw=()=>{
    const rows=teams.map(t=>({name:t.name,manager:t.manager,human:t.human,c:t._c,p:t.pts[Math.min(md,t.pts.length-1)]}))
      .sort((a,b)=>b.p-a.p);
    const el=document.getElementById('raceRows'); if(!el) return;
    el.innerHTML=rows.map((r,i)=>`<div style="display:flex;align-items:center;gap:8px;transition:all .5s ease">
      <span style="width:18px;text-align:right;font-weight:800;color:var(--muted);font-size:13px">${i+1}</span>
      <span style="width:96px;font-size:13px;font-weight:${r.human?800:700};color:${r.human?'#fff':'var(--muted)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.manager||r.name)}</span>
      <span style="flex:1;height:16px;background:var(--surface2);border-radius:8px;overflow:hidden"><span style="display:block;height:100%;width:${(r.p/maxPts*100).toFixed(1)}%;background:${r.c};border-radius:8px;transition:width .5s ease"></span></span>
      <span class="disp" style="width:30px;text-align:right;font-size:15px;font-weight:800">${r.p}</span></div>`).join('');
    const mdEl=document.getElementById('raceMd'); if(mdEl) mdEl.textContent='Matchday '+(md+1);
  };
  let prevLeader=null;
  const leaderNow=()=>{ const r=teams.map(t=>({n:t.manager||t.name,p:t.pts[Math.min(md,t.pts.length-1)]})).sort((a,b)=>b.p-a.p); return r[0]&&r[0].n; };
  draw(); sfx('tick'); prevLeader=leaderNow();
  const stepAll=()=>{
    if(!document.getElementById('raceRows')){ ceremonyPodium(window.__finalData); return; }
    md++;
    if(md>=MD){
      draw(); sfx('prize');
      // the ceremony is just a local animation of final data everyone already has —
      // let ANY player advance themselves so nobody can get stuck waiting on a host.
      const nx=document.getElementById('raceNext');
      if(nx){ nx.innerHTML = `<button class="primary bigbtn" style="max-width:300px" onclick="ceremonyPodium(window.__finalData)">Continue to the podium ▸</button>`; }
      return;
    }
    draw();
    const L=leaderNow();
    if(L!==prevLeader){ sfx('goal'); prevLeader=L; }
    else sfx('tick');
    CTIMERS.push(setTimeout(stepAll, 620));
  };
  CTIMERS.push(setTimeout(stepAll, 1000));
}
function ceremonyPodium(f){
  CTIMERS.forEach(clearTimeout); CTIMERS=[];
  const podium=f.table.slice(0,3);
  const nm=(t)=>esc(t.name)+(t.manager?` <span class="muted" style="font-size:18px">(${esc(t.manager)})</span>`:'');
  const stage=(html2)=>$(`<div class="screen center" style="justify-content:center">${html2}</div>`);
  stage(`<div class="ceremonyTxt">The season is over</div>`);
  CTIMERS.push(setTimeout(()=>stage(`<div class="eyebrow" style="margin-bottom:14px">The podium</div>
    <div class="podiumRow"><span class="podiumPos">3rd</span><span class="podiumName">${nm(podium[2])}</span></div>`),1800));
  CTIMERS.push(setTimeout(()=>stage(`<div class="eyebrow" style="margin-bottom:14px">The podium</div>
    <div class="podiumRow" style="opacity:1;animation:none"><span class="podiumPos">3rd</span><span class="podiumName">${nm(podium[2])}</span></div>
    <div class="podiumRow"><span class="podiumPos">2nd</span><span class="podiumName">${nm(podium[1])}</span></div>`),3600));
  CTIMERS.push(setTimeout(()=>stage(`<div class="spinPulse" style="font-size:26px">And your champion is…</div>`),5600));
  CTIMERS.push(setTimeout(()=>{ stage(`<div class="trophy" style="font-size:64px">🏆</div>
    <div class="champName">${esc(f.champion.name)}</div>
    ${f.champion.manager?`<div class="bidder" style="font-size:22px;margin-top:10px">${esc(f.champion.manager)}${f.champion.manager===ME.name?' <span style="color:var(--you);font-weight:800">— THAT\'S YOU</span>':''}</div>`:'<div class="muted" style="margin-top:10px">An AI club. Embarrassing scenes.</div>'}
    <button class="primary bigbtn" style="margin-top:34px;max-width:340px;opacity:0;animation:pop .5s 1.4s forwards" onclick="showFinal()">Final table & awards</button>`);
    confetti(); CTIMERS.push(setTimeout(confetti,900));
    sfx('cheer'); CTIMERS.push(setTimeout(()=>sfx('cheer'),700));
  },7900));
  window.__finalData=f;
}
function showFinal(){
  CTIMERS.forEach(clearTimeout); CTIMERS=[];
  const f=window.__finalData; if(!f) return;
    const a=f.awards;
  const champMine = f.champion.manager===ME.name;
  $(`<div class="blackbox" style="padding:26px 16px;margin-top:18px">
    <div class="trophy">🏆</div>
    <div class="eyebrow">${champMine?'You are the champion':'Champions'}</div>
    <div class="score" style="font-size:clamp(28px,7vw,46px);word-break:break-word">${esc(f.champion.name)}</div>
    ${f.champion.manager?`<div class="bidder" style="font-size:18px">${esc(f.champion.manager)}</div>`:'<div class="muted">An AI club took it. Embarrassing.</div>'}
  </div>
  ${tableHTML(f.table,'Final table')}
  <h2>Awards</h2><div class="panel">
    ${a.goldenBoot?`<div class="award"><b>👟 Golden Boot</b><span>${esc(a.goldenBoot.player)} · ${a.goldenBoot.goals} (${esc(a.goldenBoot.owner)})</span></div>`:''}
    ${a.mostAssists?`<div class="award"><b>🎯 Most Assists</b><span>${esc(a.mostAssists.player)} · ${a.mostAssists.assists} (${esc(a.mostAssists.owner)})</span></div>`:''}
    ${a.bestSigning?`<div class="award"><b>⭐ Best Signing</b><span>${esc(a.bestSigning.player)} £${a.bestSigning.price}m (${esc(a.bestSigning.manager)})</span></div>`:''}
    ${a.bestBargain?`<div class="award"><b>💎 Best Bargain</b><span>${esc(a.bestBargain.player)} £${a.bestBargain.price}m (${esc(a.bestBargain.manager)})</span></div>`:''}
    ${a.biggestFlop?`<div class="award"><b>🗑 Biggest Flop</b><span>${esc(a.biggestFlop.player)} £${a.biggestFlop.price}m (${esc(a.biggestFlop.manager)})</span></div>`:''}
    ${a.winterSplash?`<div class="award"><b>💰 Winter splash</b><span>${esc(a.winterSplash.player)} — £${a.winterSplash.price}m (${esc(a.winterSplash.manager)})</span></div>`:''}
  </div>
  ${f.stats?statPanels(f.stats):''}
  ${(()=>{ const mine=f.breakdowns&&f.breakdowns.find(b=>b.manager===ME.name); if(!mine) return '';
    const sorted=[...mine.squad].sort((a,b)=>b.goals-a.goals||b.assists-a.assists);
    return `<h2 style="margin:14px 0 4px">Your squad this season</h2>
    <div class="panel" style="padding:8px 10px">${sorted.map(p=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap;gap:6px">
      <span class="pos ${p.pos}">${p.pos}</span>
      <span class="grow" style="font-size:15px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}${p.wonderkid?' ⭐':''}${p.legend?' 👑':''}${p.hero?' 🔥':''}</span>
      <span style="flex-shrink:0;white-space:nowrap;display:flex;gap:4px"><span class="st" style="background:#000;color:#fff;font-size:12px;padding:2px 5px">G:${p.goals}</span><span class="st" style="background:#000;color:#fff;font-size:12px;padding:2px 5px">A:${p.assists}</span></span>
      <span class="formchip ${fcCls(p.form)}" style="font-size:13px;min-width:38px;padding:3px 5px;flex-shrink:0">${p.form==null?'–':p.form.toFixed(1)}</span>
      <span class="disp" style="font-family:var(--disp);font-weight:800;font-size:18px;flex-shrink:0">${Math.round(p.rating)}</span></div>`).join('')}</div>`; })()}
  <button class="primary" style="width:100%;margin-top:10px;position:relative;z-index:60" onclick="location.reload()">‹ Back to home</button>
  <div class="muted center" style="margin-top:10px;font-size:14px">Take your time — the stats stay here until you leave.</div>
  <div style="height:160px;flex-shrink:0"></div>`);
}

/* ---------------- CONNECTION ---------------- */
s.on('paused',(p)=>{ sfx('pause'); isPaused=true; syncPauseBtn(); const b=document.getElementById('pausebar');
  b.textContent = p.byHost ? '⏸ Paused' : `⏸ ${p.manager} disconnected — paused`;
  b.style.display='block'; });
let isPaused=false;
s.on('hostChanged',(x)=>{
  ME.isHost = (x.hostUid && ME.uid) ? (x.hostUid===ME.uid) : (x.hostId===ME.id);
  toast(esc(x.name)+' is now host');
});
s.on('resumed',(r)=>{ isPaused=false; hostPausedLocal=false; syncPauseBtn();
  const b=document.getElementById('pausebar'); if(b) b.style.display='none';
  if(A&&r&&r.deadline) A.deadline=r.deadline; });
s.on('autoFill',(x)=>{ if(x.manager===ME.name){ MYSQUAD.push({name:x.player,pos:x.pos}); toast(`Auto-fill: ${x.player} (${x.pos})`);} });
s.on('startersLocked',(x)=>{
  if(!lockedManagers.includes(x.manager)) lockedManagers.push(x.manager);
  const el=document.getElementById('lockedlist');
  if(el) el.innerHTML=lockedManagers.map(n=>`<div>🟢 ${esc(n)}</div>`).join('');
});
s.on('connect',()=>{
  // socket (re)connected: reclaim seat deterministically by uid via the shared resync path
  resyncSession();
});
s.on('disconnect',()=>{
  // socket dropped mid-session: block input behind the blur until we're confirmed live again
  if(ME.code) showReconn();
});
home();
(function(){ const b=document.getElementById('sndBtn'); if(b) b.textContent=SND?'🔊':'🔇'; })();
// Refreshing a scrollable page makes browsers restore the OLD scroll position
// (which lands at the bottom). Disable that and pin to the top on every load.
if('scrollRestoration' in history) history.scrollRestoration='manual';
window.scrollTo(0,0);
requestAnimationFrame(()=>window.scrollTo(0,0));
window.addEventListener('load',()=>window.scrollTo(0,0));
</script>
</body>
</html>
